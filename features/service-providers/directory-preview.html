<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OLDX Service Directory Preview</title>
<style>
:root{font:16px system-ui,sans-serif;color:#18363b;background:#f3f7f7}
*{box-sizing:border-box}body{margin:0;padding:20px}
main{max-width:920px;margin:auto}h1{margin-bottom:4px}
.notice{padding:12px 16px;background:#e1f4ef;border-radius:12px}
.oldx-service-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:20px 0}
input,select{width:100%;padding:12px;border:1px solid #a5bbbc;border-radius:10px;background:white;font:inherit}
.oldx-service-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px}
.oldx-service-card{background:white;border:1px solid #d7e3e3;border-radius:16px;padding:18px;box-shadow:0 4px 16px #173c3c0b}
.oldx-service-card h3{margin:0 0 8px}
.oldx-service-card p{line-height:1.45;overflow-wrap:anywhere}
button{border:0;border-radius:10px;padding:10px 14px;background:#006e68;color:white;font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3ab9b1;outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>OLDX Service Providers</h1>
<p class="notice">Demo profiles only. No Firebase connection, real provider data, or live chat.</p>
<div id="directory"></div>
<p id="selection" role="status" aria-live="polite"></p>
</main>
<script type="module">
import { mountPublicServiceDirectory } from "./public-directory.js";
const profiles = [
 {id:"demo-carpenter",status:"active",displayName:"Sample Carpenter",description:"Furniture repair and woodwork",city:"Ahmedabad",district:"Ahmedabad",serviceCategories:["carpenter"]},
 {id:"demo-electrician",status:"active",displayName:"Sample Electrician",description:"Home wiring and electrical repairs",city:"Surat",district:"Surat",serviceCategories:["electrician","appliance-repair"]},
 {id:"demo-plumber",status:"active",displayName:"Sample Plumbing Service",description:"Water tap and pipe repairs",city:"Rajkot",district:"Rajkot",serviceCategories:["plumber"]},
 {id:"demo-pending",status:"pending",displayName:"Hidden Pending Profile",description:"Must not appear",city:"Ahmedabad",district:"Ahmedabad",serviceCategories:["painter"]}
];
mountPublicServiceDirectory(document.getElementById("directory"), {
 profiles,
 onProfileOpen(id) { document.getElementById("selection").textContent = "Selected demo profile: " + id; }
});
</script>
</body>
</html>
