<!DOCTYPE html>
<html lang="gu" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OldX - Pan-India C2C Marketplace</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0F766E',
                        darkBg: '#111827'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-darkBg dark:text-gray-100 transition-colors duration-300">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 bg-white dark:bg-gray-800 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <h1 class="text-2xl font-bold text-primary dark:text-teal-400">OldX</h1>
            </div>
            <div class="flex items-center space-x-4">
                <!-- Language Selector -->
                <select id="languageSelect" onchange="changeLanguage(this.value)" class="bg-gray-100 dark:bg-gray-700 text-sm px-2 py-1 rounded border dark:border-gray-600 focus:outline-none">
                    <option value="gu">ગુજરાતી</option>
                    <option value="hi">हिंदी</option>
                    <option value="en">English</option>
                </select>
                <!-- Dark Mode Toggle -->
                <button onclick="toggleDarkMode()" class="p-2 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200">
                    <i id="darkModeIcon" class="fa-solid fa-moon"></i>
                </button>
                <!-- Sell Button -->
                <button onclick="openSellModal()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg font-semibold text-sm shadow">
                    <i class="fa-solid fa-plus mr-1"></i> Sell Item
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="bg-gradient-to-r from-teal-800 to-primary text-white py-12 px-4 text-center">
        <div class="max-w-4xl mx-auto">
            <h2 id="bannerTitle" class="text-3xl md:text-4xl font-extrabold mb-4">
                Bharatnu Potanu Trusted Marketplace 🇮🇳
            </h2>
            <p id="bannerDesc" class="text-teal-100 text-lg mb-6">
                Jya Juna Thi Lai Ne Nava Vastar, Gadgets Ane Properties Vecho Palak Jhapkata! Pan-India Escrow Payment Protection & Home Pickup Doorstep Delivery.
            </p>
            <div class="flex flex-col md:flex-row justify-center gap-3">
                <input type="text" id="searchInput" placeholder="Search laptops, mobiles, cars..." class="px-4 py-3 rounded-lg text-gray-800 w-full md:w-96 focus:outline-none shadow">
                <select id="stateFilter" class="px-4 py-3 rounded-lg text-gray-800 font-medium focus:outline-none shadow">
                    <option value="">All States / All India (Pan-India)</option>
                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                    <option value="Assam">Assam</option>
                    <option value="Bihar">Bihar</option>
                    <option value="Chhattisgarh">Chhattisgarh</option>
                    <option value="Goa">Goa</option>
                    <option value="Gujarat">Gujarat</option>
                    <option value="Haryana">Haryana</option>
                    <option value="Himachal Pradesh">Himachal Pradesh</option>
                    <option value="Jharkhand">Jharkhand</option>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Kerala">Kerala</option>
                    <option value="Madhya Pradesh">Madhya Pradesh</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Manipur">Manipur</option>
                    <option value="Meghalaya">Meghalaya</option>
                    <option value="Mizoram">Mizoram</option>
                    <option value="Nagaland">Nagaland</option>
                    <option value="Odisha">Odisha</option>
                    <option value="Punjab">Punjab</option>
                    <option value="Rajasthan">Rajasthan</option>
                    <option value="Sikkim">Sikkim</option>
                    <option value="Tamil Nadu">Tamil Nadu</option>
                    <option value="Telangana">Telangana</option>
                    <option value="Tripura">Tripura</option>
                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                    <option value="Uttarakhand">Uttarakhand</option>
                    <option value="West Bengal">West Bengal</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                </select>
            </div>
        </div>
    </section>

    <!-- Categories Section -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <h3 class="text-xl font-bold mb-4">Categories</h3>
        <div class="grid grid-cols-2 md:grid-cols-6 gap-4 mb-8">
            <div onclick="filterCategory('all')" class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow text-center cursor-pointer hover:border-primary border-2 border-transparent">
                <i class="fa-solid fa-box text-2xl text-primary mb-2"></i>
                <p class="font-medium text-sm">All Items</p>
            </div>
            <div onclick="filterCategory('electronics')" class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow text-center cursor-
