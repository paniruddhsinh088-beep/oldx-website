<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title data-i18n="discovery.heading">Bounded sample discovery</title><link rel="stylesheet" href="./features/stores/store-preview.css"></head><body><a class="skip" href="#main" data-i18n="store.skip">મુખ્ય સામગ્રી પર જાઓ</a>
<header><div class="bar"><a href="./service-preview.html" data-i18n="inbox.backServices">Service samples</a><strong>OldX</strong></div><div class="bar locale"><label for="localeSelect" data-i18n="languageLabel">ભાષા</label><select id="localeSelect"><option value="gu">ગુજરાતી</option><option value="hi">हिन्दी</option><option value="en">English</option></select><p id="localeStatus" role="status"></p></div></header>
<main id="main" tabindex="-1"><h1 data-i18n="discovery.heading">Bounded sample discovery</h1><p class="notice" data-i18n="discovery.notice">Synthetic public discovery only. No real accounts or Firebase.</p><form id="discoveryFilters" class="panel"><div class="fields"><div><label for="discoveryCategory" data-i18n="discovery.category">Service category</label><select id="discoveryCategory"><option value="" data-i18n="discovery.all">All samples</option></select></div><div><label for="discoveryLocality" data-i18n="discovery.locality">Sample locality</label><select id="discoveryLocality"><option value="" data-i18n="discovery.all">All samples</option></select></div><div><label for="discoveryMode" data-i18n="discovery.mode">Synthetic read rehearsal</label><select id="discoveryMode"><option value="normal" data-i18n="discovery.normal">Normal</option><option value="slow" data-i18n="discovery.slow">Delayed</option><option value="error" data-i18n="discovery.failure">Error</option><option value="timeout" data-i18n="discovery.deadline">Timeout</option></select></div></div><label class="check"><input id="withdrawDiscovery" type="checkbox"><span data-i18n="discovery.withdraw">Withdraw first sample</span></label></form>
<h2 id="discoveryResultsHeading" tabindex="-1" data-i18n="discovery.results">Public sample results</h2><p id="discoveryLoading" role="status" data-i18n="discovery.loading" hidden>Loading…</p><p id="discoveryCount" role="status"></p><p id="discoveryEmpty" data-i18n="discovery.empty" hidden>No sample results.</p><section id="discoveryError" class="panel" hidden><p id="discoveryErrorText" role="status"></p><button id="retryDiscovery" type="button" data-i18n="discovery.retry">Retry first page</button></section><div id="discoveryRows" class="cards"></div><nav class="pagination" aria-label="Sample result pages" data-i18n-aria-label="discovery.results"><button id="firstDiscovery" type="button" class="secondary" data-i18n="discovery.first" disabled>First page</button><button id="nextDiscovery" type="button" data-i18n="discovery.next" disabled>Next page</button></nav><footer data-i18n="store.footer">Synthetic preview only · No live Firebase reads/writes</footer></main><script type="module" src="./features/service-providers/preview-discovery-controller.mjs"></script></body></html>
