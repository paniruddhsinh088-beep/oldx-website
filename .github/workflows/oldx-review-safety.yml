name: OLDX review-branch safety tests

on:
  push:
    branches:
      - security-hardening-review
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oldx-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-safety-tests:
    name: Local config and emulator-safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java 21 for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run Firebase environment generation safety tests
        run: npm run test:firebase-config

      - name: Run dependency-free safety tests
        run: npm run test:emulator:safety

      - name: Run synthetic product privacy migration tests
        run: npm run test:product-migration

      - name: Run product category schema tests
        run: npm run test:product-category

      - name: Run synthetic product image reference classifier tests
        run: npm run test:product-image-classifier

      - name: Run provider-neutral image upload contract policy tests
        run: npm run test:image-upload-contract

      - name: Run image lifecycle authorization policy tests
        run: npm run test:image-lifecycle

      - name: Run upload abuse and cleanup policy tests
        run: npm run test:image-upload-abuse

      - name: Run inbox summary policy tests
        run: npm run test:inbox-summary

      - name: Run chat read receipt policy tests
        run: npm run test:chat-read-receipt

      - name: Run chat message authorization policy tests
        run: npm run test:chat-message-authorization

      - name: Run account deletion policy tests
        run: npm run test:account-deletion

      - name: Run local Admin backend starter tests
        run: npm run test:admin-backend

      - name: Install test-only Firebase tooling
        run: npm install --no-save --package-lock=false firebase-tools @firebase/rules-unit-testing firebase

      - name: Run Firestore Emulator authorization tests
        run: npm run test:emulator:rules

      - name: Run Firebase Storage Emulator authorization tests
        run: npm run test:storage:rules
