name: OLDX review-branch safety tests

on:
  push:
    branches:
      - security-hardening-review
  pull_request:
    branches:
      - security-hardening-review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oldx-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-safety-tests:
    name: Local config and emulator-safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java 21 for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run Firebase environment generation safety tests
        run: npm run test:firebase-config

      - name: Run dependency-free safety tests
        run: npm run test:emulator:safety

      - name: Run synthetic product privacy migration tests
        run: npm run test:product-migration

      - name: Run product category schema tests
        run: npm run test:product-category

      - name: Run synthetic product image reference classifier tests
        run: npm run test:product-image-classifier

      - name: Run provider-neutral image upload contract policy tests
        run: npm run test:image-upload-contract

      - name: Run image lifecycle authorization policy tests
        run: npm run test:image-lifecycle

      - name: Run upload abuse and cleanup policy tests
        run: npm run test:image-upload-abuse

      - name: Run inbox summary policy tests
        run: npm run test:inbox-summary

      - name: Run chat read receipt policy tests
        run: npm run test:chat-read-receipt

      - name: Run chat message authorization policy tests
        run: npm run test:chat-message-authorization

      - name: Run account deletion policy tests
        run: npm run test:account-deletion

      - name: Run privacy preferences and scoped consent policy tests
        run: npm run test:privacy-policy

      - name: Run data export and deletion request policy tests
        run: npm run test:data-requests

      - name: Run chat privacy and block policy tests
        run: npm run test:chat-privacy

      - name: Run Firestore Rules-verifiable chat block policy model tests
        run: npm run test:chat-block-policy

      - name: Run private chat user-state policy model tests
        run: npm run test:chat-private-user-state

      - name: Run local Admin backend starter tests
        run: npm run test:admin-backend

      - name: Install test-only Firebase tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate locale catalogs and fallback boundaries
        run: npm run test:i18n

      - name: Verify scoped CLI dependency compatibility (no cloud access)
        run: npm run test:toolchain

      - name: Validate static browser asset package
        run: npm run test:static-build

      - name: Test isolated privacy-safe Store catalogue model
        run: npm run test:stores

      - name: Validate isolated Store preview boundaries
        run: npm run test:stores:preview

      - name: Check isolated Store preview in a local browser
        run: CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)" npm run test:stores:browser

      - name: Validate isolated Service preview source
        run: npm run test:service-preview

      - name: Check isolated Service preview in a local browser
        run: CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)" npm run test:service-preview:browser

      - name: Check isolated provider enquiry inbox in a local browser
        run: CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)" npm run test:service-inbox:browser

      - name: Verify loopback-only emulator test plans
        run: npm run test:emulator:guard

      - name: Run Firestore Emulator authorization tests
        run: npm run test:emulator:rules

      - name: Run Firebase Storage Emulator authorization tests
        run: npm run test:storage:rules

      - name: Run isolated chat private user-state Firestore Rules tests
        run: npm run test:chat-private-user-state:rules
