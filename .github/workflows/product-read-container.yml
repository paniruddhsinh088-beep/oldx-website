name: Product read container smoke
on:
  push:
    branches: [security-hardening-review]
    paths:
      - '.github/workflows/product-read-container.yml'
      - 'Dockerfile.product-read*'
      - 'functions/staging-marketplace/product-read-server.mjs'
      - 'scripts/audit-product-read-image.py'
      - 'tests/integration/product-read-image-audit.test.py'

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build and check disabled startup
        shell: bash
        run: |
          node --test tests/integration/product-read-container.test.mjs tests/integration/product-read-server.test.mjs
          python3 tests/integration/product-read-image-audit.test.py
          docker pull node:24-bookworm-slim
          docker build --no-cache -f Dockerfile.product-read -t oldx-product-read:smoke .
          trap 'if docker inspect oldx-disabled >/dev/null 2>&1; then docker logs oldx-disabled; fi; docker rm -f oldx-disabled oldx-image-audit >/dev/null 2>&1 || true; rm -f "$RUNNER_TEMP/oldx-product-read.tar"' EXIT
          image=oldx-product-read:smoke
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = node
          test "$(docker run --rm --network none --entrypoint id "$image" -u)" = 1000
          case "$(docker image inspect --format '{{json .RepoDigests}}' "$image")" in
            '[]'|null) ;;
            *) echo 'Unexpected registry digest on local build' >&2; exit 1 ;;
          esac
          metadata=$(docker image inspect --format 'local_image_id={{.Id}} size_bytes={{.Size}} platform={{.Os}}/{{.Architecture}}' "$image")
          echo "::notice title=Product read image::source_sha=$GITHUB_SHA $metadata"
          docker run --rm --network none --entrypoint cat node:24-bookworm-slim /usr/local/lib/node_modules/npm/.npmrc > "$RUNNER_TEMP/oldx-base-npmrc"
          docker save -o "$RUNNER_TEMP/oldx-product-read.tar" "$image"
          layer_count=$(docker image inspect --format '{{len .RootFS.Layers}}' "$image")
          layer_result=$(python3 scripts/audit-product-read-image.py "$RUNNER_TEMP/oldx-product-read.tar" "$RUNNER_TEMP/oldx-base-npmrc" "$layer_count")
          echo "::notice title=Product read layer audit::$layer_result"
          docker create --name oldx-image-audit oldx-product-read:smoke >/dev/null
          docker export oldx-image-audit | tar -tf - > "$RUNNER_TEMP/oldx-image-files"
          sed -nE 's|^\./||; /^app\/node_modules(\/|$)/d; /^app\/[^/]/ { /\/$/!p; }' "$RUNNER_TEMP/oldx-image-files" | sort > "$RUNNER_TEMP/oldx-app-files"
          sed -nE '/^![^!].*[^/]$/s|^!|app/|p' Dockerfile.product-read.dockerignore | sort > "$RUNNER_TEMP/oldx-expected-files"
          diff -u "$RUNNER_TEMP/oldx-expected-files" "$RUNNER_TEMP/oldx-app-files"
          # Allow only npm's unchanged built-in config from the base image.
          npm_config_path=usr/local/lib/node_modules/npm/.npmrc
          sed 's|^\./||' "$RUNNER_TEMP/oldx-image-files" > "$RUNNER_TEMP/oldx-normalized-files"
          if grep -Fxq "$npm_config_path" "$RUNNER_TEMP/oldx-normalized-files"; then
            docker cp "oldx-image-audit:/$npm_config_path" "$RUNNER_TEMP/oldx-image-npmrc"
            cmp "$RUNNER_TEMP/oldx-base-npmrc" "$RUNNER_TEMP/oldx-image-npmrc"
          fi
          if grep -vFx "$npm_config_path" "$RUNNER_TEMP/oldx-normalized-files" | grep -Ei '(^|/)(\.env(\.[^/]*)?|\.npmrc|\.git-credentials|application_default_credentials\.json|service[-_]?account[^/]*\.json|firebase-env\.js|google-services\.json|id_(rsa|ed25519))$'; then
            echo 'Sensitive filename found in image' >&2
            exit 1
          fi
          docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' oldx-product-read:smoke | cut -d= -f1 > "$RUNNER_TEMP/oldx-image-env-names"
          if grep -Eiq 'credential|secret|token|private_key|firebase|api_key' "$RUNNER_TEMP/oldx-image-env-names"; then
            echo 'Sensitive environment variable name found in image configuration' >&2
            exit 1
          fi
          while IFS= read -r path; do
            if grep -Eq -- '-----BEGIN [A-Z ]*PRIVATE KEY-----|"private_key"[[:space:]]*:|"type"[[:space:]]*:[[:space:]]*"service_account"' "${path#app/}"; then
              echo "Credential marker found in build input: ${path#app/}" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/oldx-expected-files"
          echo 'Image merged filesystem, app allowlist, image environment names and build-input markers passed'
          if docker run --rm --network none -e PORT=invalid oldx-product-read:smoke > "$RUNNER_TEMP/oldx-invalid-port" 2>&1; then
            echo 'Invalid PORT unexpectedly started' >&2
            exit 1
          else
            test "$?" = 1
            grep -Fxq 'Product read server startup failed.' "$RUNNER_TEMP/oldx-invalid-port"
          fi
          echo 'Invalid PORT exited with code 1'
          docker run -d --name oldx-disabled --network none -e PORT=18081 "$image"
          docker exec oldx-disabled node -e '
            const assert = require("node:assert/strict");
            const base = "http://127.0.0.1:18081";
            (async () => {
              let health;
              for (let attempt = 0; attempt < 15 && !health; attempt++) {
                try {
                  health = await fetch(base + "/healthz", {signal: AbortSignal.timeout(1000)});
                } catch {
                  await require("node:timers/promises").setTimeout(250);
                }
              }
              assert.ok(health, "Container health endpoint did not become reachable");
              assert.equal(health.status, 200);
              assert.deepEqual(await health.json(), {ok: true});
              const owner = await fetch(base + "/api/staging/marketplace/owner", {
                method: "POST", signal: AbortSignal.timeout(3000)
              });
              assert.equal(owner.status, 503);
              assert.deepEqual(await owner.json(), {ok: false, error: {code: "ENFORCEMENT_UNAVAILABLE"}});
            })().catch(error => { console.error(error); process.exitCode = 1; });
          '
          echo 'Custom PORT: owner route 503 and /healthz 200'
          docker stop -s SIGTERM -t 10 oldx-disabled
          test "$(docker inspect -f '{{.State.ExitCode}}' oldx-disabled)" = 0
          echo 'SIGTERM shutdown exited with code 0'
      - name: Run owner read against loopback Auth and Firestore Emulators
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          npm ci
          trap 'docker logs oldx-emulator-read 2>&1 || true; docker rm -f oldx-emulator-read >/dev/null 2>&1 || true' EXIT
          docker run -d --name oldx-emulator-read --network host -e PORT=18082             -e OLDX_PRODUCT_READ_EMULATOR=true -e GCLOUD_PROJECT=demo-oldx-admin-runtime             -e FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9098 -e FIRESTORE_EMULATOR_HOST=127.0.0.1:8088             oldx-product-read:smoke
          status=$(curl -sS --retry 15 --retry-all-errors --retry-delay 1 --max-time 3 -o "$RUNNER_TEMP/oldx-product-read-probe.json" -w '%{http_code}' http://127.0.0.1:18082/api/staging/marketplace/owner)
          test "$status" = 405
          OLDX_TEST_PRODUCT_READ_CONTAINER=true node node_modules/firebase-tools/lib/bin/firebase.js             emulators:exec --only auth,firestore --project demo-oldx-admin-runtime             --config firebase.admin-runtime-emulator.json             'node --test --test-name-pattern="owner draft|Product owner HTTP socket" tests/firestore-emulator/admin-runtime-native.test.mjs'
          docker stop -t 10 oldx-emulator-read
          test "$(docker inspect -f '{{.State.ExitCode}}' oldx-emulator-read)" = 0
