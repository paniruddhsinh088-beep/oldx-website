name: Service Providers Security Tests

on:
  push:
    branches:
      - service-providers-development
    paths:
      - "features/service-providers/**"
      - "index.html"
      - "firebase.json"
      - ".github/workflows/service-providers-security.yml"
  pull_request:
    paths:
      - "features/service-providers/**"
      - "index.html"
      - "firebase.json"
      - ".github/workflows/service-providers-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-emulator:
    name: Firestore emulator permissions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate service profile inputs (no Firebase required)
        run: node --test features/service-providers/tests/validation.test.mjs
      - name: Validate moderation integration remains opt-in
        run: node --test features/service-providers/tests/service-moderation-integration.test.mjs
      - name: Validate service profile moderation adapter
        run: node --test features/service-providers/tests/service-moderation-adapter.test.mjs
      - name: Validate approved-only public service profile lookup
        run: node --test features/service-providers/tests/service-profile-public-adapter.test.mjs
      - name: Validate review rules at UI level (no Firebase required)
        run: node --test features/service-providers/tests/reviews.test.mjs
      - name: Validate service contact restrictions (no Firebase required)
        run: node --test features/service-providers/tests/contact-policy.test.mjs
      - name: Validate OLDX contact adapter (no Firebase required)
        run: node --test features/service-providers/tests/oldx-contact-adapter.test.mjs
      - name: Validate service chat context (no Firebase required)
        run: node --test features/service-providers/tests/chat-context.test.mjs
      - name: Validate service chat message drafts
        run: node --test features/service-providers/tests/message-validation.test.mjs
      - name: Validate service chat integration bridge
        run: node --test features/service-providers/tests/oldx-chat-bridge.test.mjs
      - name: Check OLDX chat UI service regressions
        run: node --test features/service-providers/tests/oldx-chat-ui-regression.test.mjs
      - name: Validate legacy block migration preflight
        run: node --test features/service-providers/tests/legacy-block-preflight.test.mjs
      - name: Validate legacy block reconciliation planner
        run: node --test features/service-providers/tests/legacy-block-reconciliation.test.mjs
      - name: Validate legacy block parity audit
        run: node --test features/service-providers/tests/legacy-block-parity.test.mjs
      - name: Validate legacy block migration gate
        run: node --test features/service-providers/tests/legacy-block-migration-gate.test.mjs
      - name: Validate service chat launch gate
        run: node --test features/service-providers/tests/service-chat-launch-gate.test.mjs
      - name: Check service chat deployment guardrails
        run: node --test features/service-providers/tests/service-chat-deployment-guard.test.mjs
      - name: Check service chat isolation regressions
        run: node --test features/service-providers/tests/service-chat-isolation-regression.test.mjs
      - name: Check service chat write deny guard
        run: node --test features/service-providers/tests/service-chat-write-guard.test.mjs
      - name: Install test dependencies
        run: npm --prefix features/service-providers/tests install --no-audit --no-fund
      - name: Run emulator security tests
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-oldx-service --config firebase.json "npm --prefix features/service-providers/tests test"
