name: Service Providers emulator security tests

on:
  push:
    branches: [security-hardening-review]
    paths:
      - '.github/workflows/service-providers-emulator.yml'
      - 'tests/firestore-emulator/service-providers-candidate.rules'
      - 'tests/firestore-emulator/service-providers-candidate-runtime.test.mjs'
      - 'firebase.service-providers-emulator.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator test dependencies
        run: npm install --no-save --package-lock=false firebase@10.14.1 @firebase/rules-unit-testing@3.0.4 firebase-tools@13.35.1
      - name: Run isolated Firestore emulator tests
        run: npx firebase emulators:exec --only firestore --project demo-oldx-service-providers --config firebase.service-providers-emulator.json "node --test tests/firestore-emulator/service-providers-candidate-runtime.test.mjs"
