name: Service Providers emulator security tests

on:
  push:
    branches: [security-hardening-review]
    paths:
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/*emulator*.mjs'
      - '.github/workflows/service-providers-emulator.yml'
      - 'tests/firestore-emulator/service-providers-candidate.rules'
      - 'tests/firestore-emulator/service-providers-candidate-runtime.test.mjs'
      - 'firebase.service-providers-emulator.json'
      - 'features/service-providers/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate service provider draft input
        run: node --test features/service-providers/*.test.mjs
      - name: Run isolated Firestore emulator tests
        run: npm run test:service-providers:rules
