name: OLDX Branch Security Tests

on:
  push:
    branches:
      - security-hardening-review
    paths:
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/*emulator*.mjs'
      - '.github/workflows/oldx-branch-security-tests.yml'
      - 'functions/admin-backend/**'
      - 'features/service-providers/**'
      - 'features/i18n/**'
      - 'scripts/toolchain-compat.test.mjs'
      - 'scripts/chat-message-authorization-policy.mjs'
      - 'tests/firestore-emulator/chat-message-authorization-policy.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-policy-tests:
    name: Admin and chat policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install free Node dependencies (no scripts, no cloud access)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Admin backend tests (synthetic, no Firebase)
        run: npm run test:admin-backend
      - name: Chat message authorization tests (synthetic)
        run: npm run test:chat-message-authorization
      - name: Service provider module and offline QR integration tests (no Firebase)
        run: npm run test:service-providers
      - name: Locale catalogs and dependency API compatibility
        run: npm run test:i18n && npm run test:toolchain
