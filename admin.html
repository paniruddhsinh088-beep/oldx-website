<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#002f34">
    <title>OldX Admin Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { 
                    colors: { 
                        primary: '#002f34', 
                        brand: '#00a49f', 
                        accent: '#ffce32',
                        darkBg: '#0f172a' 
                    } 
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-darkBg text-gray-800 dark:text-gray-100 min-h-screen pb-20">

    <!-- Admin Header -->
    <header class="bg-primary text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
                <div class="bg-amber-400 text-primary p-2 rounded-xl font-black text-xl">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-white tracking-tight">OldX Admin Control Center</h1>
                    <p class="text-[10px] text-teal-200">System Management & Live Analytics</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-teal-700 hover:bg-teal-800 text-white px-3.5 py-1.5 rounded-xl font-bold text-xs shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-house"></i> View Main Site
                </a>
                <button onclick="handleAdminLogout()" class="bg-red-600 hover:bg-red-700 text-white px-3.5 py-1.5 rounded-xl font-bold text-xs shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Admin Dashboard Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        
        <!-- Key Metrics Grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 flex items-center gap-4">
                <div class="w-12 h-12 bg-teal-100 text-teal-700 rounded-2xl flex items-center justify-center text-xl font-bold">
                    <i class="fa-solid fa-boxes-packing"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 dark:text-gray-400 font-bold">Total Ads Posted</p>
                    <h3 id="statTotalAds" class="text-2xl font-black text-gray-900 dark:text-white">0</h3>
                </div>
            </div>

            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-100 text-blue-700 rounded-2xl flex items-center justify-center text-xl font-bold">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 dark:text-gray-400 font-bold">Total Registered Users</p>
                    <h3 id="statTotalUsers" class="text-2xl font-black text-gray-900 dark:text-white">0</h3>
                </div>
            </div>

            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 flex items-center gap-4">
                <div class="w-12 h-12 bg-amber-100 text-amber-700 rounded-2xl flex items-center justify-center text-xl font-bold">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 dark:text-gray-400 font-bold">Featured / Boosted Ads</p>
                    <h3 id="statFeaturedAds" class="text-2xl font-black text-gray-900 dark:text-white">0</h3>
                </div>
            </div>

            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 flex items-center gap-4">
                <div class="w-12 h-12 bg-emerald-100 text-emerald-700 rounded-2xl flex items-center justify-center text-xl font-bold">
                    <i class="fa-solid fa-eye"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 dark:text-gray-400 font-bold">Total Traffic Views</p>
                    <h3 id="statTotalViews" class="text-2xl font-black text-gray-900 dark:text-white">0</h3>
                </div>
            </div>
        </div>

        <!-- Management Tabs -->
        <div class="flex border-b border-gray-200 dark:border-gray-700 gap-4 text-sm font-bold">
            <button onclick="switchAdminTab('ads')" id="tabBtnAds" class="pb-3 border-b-2 border-primary text-primary dark:text-amber-400 flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-list-check"></i> Manage All Ads
            </button>
            <button onclick="switchAdminTab('users')" id="tabBtnUsers" class="pb-3 border-b-2 border-transparent text-gray-500 hover:text-gray-800 dark:hover:text-gray-200 flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-users-gear"></i> Manage Users
            </button>
        </div>

        <!-- SECTION 1: MANAGE ADS -->
        <div id="adminSectionAds" class="space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-3 bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
                <div class="relative w-full sm:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" id="adminAdSearch" oninput="filterAdminAds()" placeholder="Search ads by title, location, seller..." class="w-full pl-10 pr-4 py-2 border rounded-xl text-xs dark:bg-gray-700 dark:border-gray-600 focus:outline-none">
                </div>
                <div class="flex gap-2 w-full sm:w-auto">
                    <select id="adminCatFilter" onchange="filterAdminAds()" class="px-3 py-2 border rounded-xl text-xs dark:bg-gray-700 dark:border-gray-600 font-bold">
                        <option value="all">All Categories</option>
                        <option value="cars">Cars</option>
                        <option value="properties">Properties</option>
                        <option value="mobiles">Mobiles</option>
                        <option value="bikes">Bikes</option>
                        <option value="electronics">Electronics</option>
                        <option value="furniture">Furniture</option>
                    </select>
                </div>
            </div>

            <div id="adminAdsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>

        <!-- SECTION 2: MANAGE USERS -->
        <div id="adminSectionUsers" style="display: none;" class="space-y-4">
            <!-- User Search Bar Added Here -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col sm:flex-row justify-between items-center gap-3">
                <div class="relative w-full sm:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" id="adminUserSearch" oninput="filterAdminUsers()" placeholder="Search users by email..." class="w-full pl-10 pr-4 py-2 border rounded-xl text-xs dark:bg-gray-700 dark:border-gray-600 focus:outline-none">
                </div>
                <p class="text-xs text-gray-400 font-bold">Total Found: <span id="userSearchCount">0</span></p>
            </div>

            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
                <h3 class="font-bold text-base mb-3 text-gray-900 dark:text-white">Registered User Directory</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="border-b dark:border-gray-700 text-gray-400 uppercase text-[10px]">
                                <th class="py-2.5 px-3">Email</th>
                                <th class="py-2.5 px-3">Status</th>
                                <th class="py-2.5 px-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminUsersTableBody" class="divide-y dark:divide-gray-700 font-medium"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqMBoXtfy5qblEAm44kgLURPK20LLid5c",
            authDomain: "oldx-1c983.firebaseapp.com",
            projectId: "oldx-1c983",
            storageBucket: "oldx-1c983.firebasestorage.app",
            messagingSenderId: "1036370611979",
            appId: "1:1036370611979:web:5c3a6c754b3ad979f69c0e"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let allProducts = [];
        let allUsers = [];

        document.addEventListener('DOMContentLoaded', () => {
            auth.onAuthStateChanged(user => {
                if (!user) {
                    alert("Access Denied! Please login as admin first.");
                    window.location.href = "index.html";
                    return;
                }

                if (user.email === 'paniruddhsinh088@gmail.com') {
                    initAdminData();
                } else {
                    db.collection('admins').doc(user.uid).get().then(docSnap => {
                        if (docSnap.exists) {
                            initAdminData();
                        } else {
                            alert("Access Denied! You don't have Admin privileges.");
                            window.location.href = "index.html";
                        }
                    }).catch(() => {
                        alert("Access Denied! Security check failed.");
                        window.location.href = "index.html";
                    });
                }
            });
        });

        function initAdminData() {
            listenToStats();
            listenToProducts();
            listenToUsers();
        }

        function listenToStats() {
            db.collection('stats').doc('traffic').onSnapshot(doc => {
                if (doc.exists && doc.data().totalViews) {
                    document.getElementById('statTotalViews').innerText = doc.data().totalViews;
                } else {
                    db.collection('stats').doc('traffic').set({ totalViews: 0 }, { merge: true });
                    document.getElementById('statTotalViews').innerText = '0';
                }
            });
        }

        function listenToProducts() {
            db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                allProducts = [];
                let featuredCount = 0;

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const p = { docId: doc.id, ...data };
                    allProducts.push(p);
                    if (p.isFeatured) featuredCount++;
                });

                document.getElementById('statTotalAds').innerText = allProducts.length;
                document.getElementById('statFeaturedAds').innerText = featuredCount;
                filterAdminAds();
            });
        }

        function listenToUsers() {
            db.collection('users').onSnapshot(snapshot => {
                allUsers = [];
                snapshot.forEach(doc => {
                    const uData = doc.data();
                    allUsers.push({ 
                        uid: doc.id, 
                        email: uData.email || uData.userEmail || 'N/A',
                        isOnline: uData.isOnline || false
                    });
                });
                document.getElementById('statTotalUsers').innerText = allUsers.length;
                filterAdminUsers();
            });
        }

        function filterAdminAds() {
            const searchVal = document.getElementById('adminAdSearch').value.toLowerCase();
            const catVal = document.getElementById('adminCatFilter').value.toLowerCase();
            const container = document.getElementById('adminAdsList');
            container.innerHTML = '';

            const filtered = allProducts.filter(p => {
                const matchSearch = (p.title && p.title.toLowerCase().includes(searchVal)) || (p.location && p.location.toLowerCase().includes(searchVal)) || (p.sellerName && p.sellerName.toLowerCase().includes(searchVal));
                const matchCat = (catVal === 'all' || (p.category && p.category.toLowerCase() === catVal));
                return matchSearch && matchCat;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-xs text-gray-400 py-10">No ads match your current filter.</p>`;
                return;
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm space-y-3";
                const img = (p.images && p.images.length > 0) ? p.images[0] : 'https://cdn-icons-png.flaticon.com/512/1165/1165677.png';

                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="${img}" class="w-16 h-16 rounded-xl object-cover border bg-gray-100 shrink-0">
                        <div class="overflow-hidden">
                            <h4 class="font-bold text-xs text-gray-900 dark:text-white truncate">${p.title}</h4>
                            <p class="text-teal-600 font-extrabold text-xs mt-0.5">${p.finalPriceStr || ('₹' + p.basePrice)}</p>
                            <p class="text-[10px] text-gray-400 mt-0.5"><i class="fa-solid fa-user mr-1"></i>${p.sellerName || 'Seller'} | <i class="fa-solid fa-location-dot text-red-500"></i> ${p.location || 'N/A'}</p>
                        </div>
                    </div>

                    <div class="flex items-center justify-between border-t dark:border-gray-700 pt-2 text-[11px]">
                        <span class="font-bold text-gray-500 capitalize">${p.category || 'General'}</span>
                        <div class="flex gap-1.5">
                            <button onclick="toggleFeatureAd('${p.docId}', ${p.isFeatured || false})" class="px-2.5 py-1 rounded-lg font-bold text-white text-[10px] ${p.isFeatured ? 'bg-amber-500 hover:bg-amber-600' : 'bg-gray-600 hover:bg-gray-700'} cursor-pointer">
                                <i class="fa-solid fa-bolt mr-1"></i>${p.isFeatured ? 'Featured' : 'Boost'}
                            </button>
                            <button onclick="deleteAdminAd('${p.docId}')" class="px-2.5 py-1 rounded-lg font-bold text-white bg-red-600 hover:bg-red-700 text-[10px] cursor-pointer">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterAdminUsers() {
            const searchVal = document.getElementById('adminUserSearch') ? document.getElementById('adminUserSearch').value.toLowerCase() : '';
            const tbody = document.getElementById('adminUsersTableBody');
            tbody.innerHTML = '';

            const filteredUsers = allUsers.filter(u => u.email.toLowerCase().includes(searchVal));
            document.getElementById('userSearchCount').innerText = filteredUsers.length;

            if (filteredUsers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-gray-400">No users found.</td></tr>`;
                return;
            }

            filteredUsers.forEach(u => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 dark:hover:bg-gray-700/50";
                
                tr.innerHTML = `
                    <td class="py-3 px-3 text-gray-600 dark:text-gray-300 truncate max-w-[200px] font-semibold">${u.email}</td>
                    <td class="py-3 px-3">
                        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${u.isOnline ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">
                            ${u.isOnline ? 'Online' : 'Offline'}
                        </span>
                    </td>
                    <td class="py-3 px-3">
                        <button onclick="deleteAdminUser('${u.uid}')" class="text-red-500 hover:text-red-700 font-bold text-xs cursor-pointer flex items-center gap-1">
                            <i class="fa-solid fa-user-slash"></i> Remove
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleFeatureAd(docId, currentStatus) {
            db.collection('products').doc(docId).update({
                isFeatured: !currentStatus
            }).then(() => {
                console.log("Featured status updated!");
            }).catch(err => alert("Error: " + err.message));
        }

        function deleteAdminAd(docId) {
            if (confirm("Are you sure you want to PERMANENTLY delete this ad as Admin?")) {
                db.collection('products').doc(docId).delete().then(() => {
                    alert("Ad successfully deleted!");
                }).catch(err => alert("Error deleting ad: " + err.message));
            }
        }

        function deleteAdminUser(uid) {
            if (confirm("Are you sure you want to delete this user record from Firestore?")) {
                db.collection('users').doc(uid).delete().then(() => {
                    alert("User record deleted successfully!");
                }).catch(err => alert("Error: " + err.message));
            }
        }

        function switchAdminTab(tab) {
            const secAds = document.getElementById('adminSectionAds');
            const secUsers = document.getElementById('adminSectionUsers');
            const btnAds = document.getElementById('tabBtnAds');
            const btnUsers = document.getElementById('tabBtnUsers');

            if (tab === 'ads') {
                secAds.style.display = 'block';
                secUsers.style.display = 'none';
                btnAds.className = "pb-3 border-b-2 border-primary text-primary dark:text-amber-400 flex items-center gap-2 font-bold cursor-pointer";
                btnUsers.className = "pb-3 border-b-2 border-transparent text-gray-500 hover:text-gray-800 dark:hover:text-gray-200 flex items-center gap-2 font-bold cursor-pointer";
            } else {
                secAds.style.display = 'none';
                secUsers.style.display = 'block';
                btnUsers.className = "pb-3 border-b-2 border-primary text-primary dark:text-amber-400 flex items-center gap-2 font-bold cursor-pointer";
                btnAds.className = "pb-3 border-b-2 border-transparent text-gray-500 hover:text-gray-800 dark:hover:text-gray-200 flex items-center gap-2 font-bold cursor-pointer";
            }
        }

        function handleAdminLogout() {
            auth.signOut().then(() => {
                window.location.href = "index.html";
            });
        }
    </script>
</body>
</html>
