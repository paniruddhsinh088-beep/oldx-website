<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OldX Admin Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">🛡️ OldX Admin Dashboard</h1>
        <a href="index.html" class="bg-white text-blue-600 px-4 py-2 rounded text-sm font-semibold hover:bg-gray-100">Back to Home</a>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto p-4">
        <!-- Loading State -->
        <div id="loading" class="text-center py-10 text-gray-600 font-medium">Checking admin access and loading products...</div>

        <!-- Access Denied Message -->
        <div id="access-denied" class="hidden text-center py-20">
            <h2 class="text-2xl font-bold text-red-600 mb-2">Access Denied ❌</h2>
            <p class="text-gray-600 mb-4">You do not have administrator privileges to view this page.</p>
            <a href="index.html" class="bg-blue-600 text-white px-6 py-2 rounded font-semibold">Go to Home</a>
        </div>

        <!-- Admin Content -->
        <div id="admin-content" class="hidden">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Manage All Product Listings</h2>
            <div class="bg-white rounded-lg shadow overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700 text-sm">
                            <th class="p-3">Product</th>
                            <th class="p-3">Price</th>
                            <th class="p-3">Seller UID</th>
                            <th class="p-3 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="product-list" class="divide-y divide-gray-200 text-sm">
                        <!-- Products will be loaded dynamically here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAqMBoXtfy5qblEAm44kgLURPK20LLid5c",
            authDomain: "oldx-1c983.firebaseapp.com",
            projectId: "oldx-1c983",
            storageBucket: "oldx-1c983.firebasestorage.app",
            messagingSenderId: "1036370611979",
            appId: "1:1036370611979:web:5c3a6c754b3ad979f69c0e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loadingEl = document.getElementById('loading');
        const accessDeniedEl = document.getElementById('access-denied');
        const adminContentEl = document.getElementById('admin-content');
        const productListEl = document.getElementById('product-list');

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                loadingEl.classList.add('hidden');
                accessDeniedEl.classList.remove('hidden');
                return;
            }

            try {
                const adminDocRef = doc(db, "admins", user.uid);
                const adminDoc = await getDoc(adminDocRef);

                if (adminDoc.exists()) {
                    loadingEl.classList.add('hidden');
                    adminContentEl.classList.remove('hidden');
                    loadProducts();
                } else {
                    loadingEl.classList.add('hidden');
                    accessDeniedEl.classList.remove('hidden');
                }
            } catch (error) {
                console.error("Error verifying admin:", error);
                loadingEl.classList.add('hidden');
                accessDeniedEl.classList.remove('hidden');
            }
        });

        async function loadProducts() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                productListEl.innerHTML = "";

                if (querySnapshot.empty) {
                    productListEl.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-500">No products found.</td></tr>`;
                    return;
                }

                querySnapshot.forEach((productDoc) => {
                    const product = productDoc.data();
                    const productId = productDoc.id;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="p-3 flex items-center gap-3">
                            <img src="${product.imageUrl || product.images?.[0] || 'https://via.placeholder.com/50'}" class="w-10 h-10 object-cover rounded">
                            <span class="font-medium text-gray-800">${product.title || 'Untitled'}</span>
                        </td>
                        <td class="p-3 text-gray-600">${product.finalPriceStr || ('₹' + (product.price || 0))}</td>
                        <td class="p-3 text-gray-500 text-xs truncate max-w-[120px]">${product.sellerUid || 'N/A'}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteProduct('${productId}')" class="bg-red-500 text-white px-3 py-1 rounded text-xs font-semibold hover:bg-red-600">Delete</button>
                        </td>
                    `;
                    productListEl.appendChild(tr);
                });
            } catch (error) {
                console.error("Error loading products:", error);
            }
        }

        window.deleteProduct = async function(productId) {
            if (confirm("Are you sure you want to delete this product as Admin?")) {
                try {
                    await deleteDoc(doc(db, "products", productId));
                    alert("Product deleted successfully!");
                    loadProducts();
                } catch (error) {
                    console.error("Error deleting product:", error);
                    alert("Failed to delete product. Check Firestore rules.");
                }
            }
        };
    </script>
</body>
</html>
